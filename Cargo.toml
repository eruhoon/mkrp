[workspace]
resolver = "2"
members = [
    "crates/mkrp-rpa",
    "crates/mkrp-rpyc",
    "crates/mkrp-render",
    "crates/mkrp-core",
    "crates/mkrp-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["mkrp contributors"]
license = "MIT"

[workspace.dependencies]
thiserror = "2.0"
byteorder = "1.5"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"
log = "0.4"
libloading = "0.8"
fontdue = "0.9"
